<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Software Testing for Beginners</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mu:#5d6675;--bd:#dde1e7;--ac:#2563eb;--ok:#16a34a;--no:#dc2626;--wn:#d97706;--code:#eef1f5;--okb:#e8f6ed;--nob:#fdeaea;--wnb:#fef3e0;--bt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1216;--card:#181c22;--tx:#e8eaee;--mu:#98a1b0;--bd:#2a303a;--ac:#5b8cff;--ok:#4ade80;--no:#f87171;--wn:#fbbf24;--code:#222831;--okb:#12261a;--nob:#2b1717;--wnb:#2b2212;--bt:#0f1216}}
:root[data-theme="dark"]{--bg:#0f1216;--card:#181c22;--tx:#e8eaee;--mu:#98a1b0;--bd:#2a303a;--ac:#5b8cff;--ok:#4ade80;--no:#f87171;--wn:#fbbf24;--code:#222831;--okb:#12261a;--nob:#2b1717;--wnb:#2b2212;--bt:#0f1216}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);min-height:42px;margin:0 6px 8px 0}
input[type=checkbox]{min-height:0;width:18px;height:18px;padding:0;margin:0 4px 0 0;vertical-align:middle}
label{margin-right:10px;display:inline-block;margin-bottom:8px}
button{cursor:pointer}button:hover{border-color:var(--ac)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{background:var(--ac);color:#fff;border:0;font-weight:600}.btn:disabled{opacity:.4;cursor:default}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd)}
.hd{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.hd button{margin:0;min-height:34px;padding:4px 10px;font-size:13px}
.brand{font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--ac)}
.pg{flex:1;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:6px;background:var(--code);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
#cnt{font:600 14px ui-monospace,Menlo,Consolas,monospace;color:var(--mu)}
.app{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:230px 1fr;align-items:start}
nav{position:sticky;top:64px;padding:16px;border-right:1px solid var(--bd)}
nav h3{margin:0 0 8px;font-size:.8rem;color:var(--mu);font-weight:600}
nav button{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;padding:7px 10px;min-height:0;margin:0;color:var(--mu);font-size:.9rem}
nav button b{width:16px;text-align:center}
nav button.cur{background:var(--code);color:var(--tx);font-weight:600}nav button.vis b{color:var(--ok)}
main{padding:24px 24px 100px;min-width:0}
section{display:none}section.on{display:block;animation:fi .25s}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1{font-size:2.6rem;line-height:1.1;margin:0 0 10px;letter-spacing:-.02em}
h2{margin:0;font-size:1.7rem;letter-spacing:-.01em}
.tag{font:600 13px ui-monospace,Menlo,Consolas,monospace;color:var(--ac)}
.one{color:var(--mu);margin:4px 0 4px;font-size:1.05rem}.an{color:var(--mu);margin:0 0 16px;font-size:.92rem}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.panel>h4{margin:0 0 10px;font-size:.95rem}
.out{margin-top:6px;padding:10px 14px;border:1px solid var(--bd);border-left:4px solid var(--bd);border-radius:8px;background:var(--code);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px;transition:background .2s}
.out[data-s]::before{display:block;margin-bottom:4px;font-weight:700;font-size:11px}
.out[data-s=ok]{border-left-color:var(--ok);background:var(--okb)}.out[data-s=ok]::before{content:"\25CF PASS";color:var(--ok)}
.out[data-s=no]{border-left-color:var(--no);background:var(--nob)}.out[data-s=no]::before{content:"\25CF FAIL";color:var(--no)}
.out[data-s=wn]{border-left-color:var(--wn);background:var(--wnb)}.out[data-s=wn]::before{content:"\25CF WARNING";color:var(--wn)}
details.lm{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:16px}
details.lm>summary{cursor:pointer;padding:14px 18px;font-weight:600;color:var(--ac);list-style:none}
details.lm>summary::after{content:"+";float:right}details.lm[open]>summary::after{content:"\2212"}
.lmb{padding:0 18px 18px;animation:fi .2s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px}
.cell{border:1px solid var(--bd);border-radius:8px;padding:10px 12px;background:var(--bg)}
.cell b{display:block;font-size:.8rem;color:var(--mu);margin-bottom:2px}.cell span{font-size:.92rem}
.lmb h5{margin:16px 0 6px;font-size:.85rem;color:var(--mu)}
.ed{background:#0d1117;border-radius:10px;overflow:hidden;color:#e6edf3}
.edh{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid #30363d;font:12px ui-monospace,Menlo,Consolas,monospace;color:#8b949e}
.edh button{min-height:30px;padding:2px 10px;margin:0;background:#21262d;color:#e6edf3;border:1px solid #30363d;font-size:12px}
.cd{overflow-x:auto;padding:10px 0;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace}
.cl{display:flex;white-space:pre;padding-right:14px}
.ln{width:36px;flex:none;text-align:right;padding-right:12px;color:#6e7681;user-select:none}
.c{color:#8b949e}.s{color:#a5d6ff}.k{color:#ff7b72}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.flow i{font-style:normal;color:var(--mu)}
.nd{display:inline-block;border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:5px 10px;font:600 12px ui-monospace,Menlo,Consolas,monospace}
.nd em{font-style:normal;color:var(--ac);margin-right:6px}
pre{background:var(--code);border-radius:8px;padding:10px;margin:8px 0 0;overflow-x:auto;font:12.5px/1.4 ui-monospace,Menlo,Consolas,monospace}
.chk{display:flex;gap:10px;align-items:flex-start;margin:0}.chk input{margin-top:3px}
.chk.done span{text-decoration:line-through;color:var(--mu)}
.logt{max-height:240px;overflow:auto;border:1px solid var(--bd);border-radius:8px;font:13px ui-monospace,Menlo,Consolas,monospace}
.lr{display:grid;grid-template-columns:80px 1fr 90px;gap:8px;padding:7px 10px;border-bottom:1px solid var(--bd);align-items:center;min-width:360px;word-break:break-word}
.lr.lh{position:sticky;top:0;background:var(--code);color:var(--mu);font-weight:600;font-size:11px}
.bd{display:inline-block;padding:1px 10px;border-radius:99px;font:700 12px ui-monospace,Menlo,Consolas,monospace;color:var(--bt)}
.bd.ok{background:var(--ok)}.bd.no{background:var(--no)}.bd.wn{background:var(--wn)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start;margin-bottom:24px}
.stack{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.stack button{text-align:left;font-size:.9rem;padding:7px 12px;min-height:0;margin:0}
.core{margin-top:4px;text-align:center;background:var(--code);border-radius:8px;padding:8px;font:600 13px ui-monospace,Menlo,Consolas,monospace}
.fd{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fd .top{border-color:var(--ac);background:var(--ac);color:#fff}.fd .top b{color:#fff}.fd .top span{color:#dbe6ff}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.fi{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;gap:8px}.fi button{margin:0}
@media(max-width:820px){
.app{grid-template-columns:1fr}
nav{position:static;display:flex;gap:4px;overflow-x:auto;padding:8px;border:0;border-bottom:1px solid var(--bd);white-space:nowrap}
nav h3{display:none}nav button{width:auto;flex:none}
main{padding:16px 14px 100px}h1{font-size:2rem}.hero{grid-template-columns:1fr}
.panel button,.panel input:not([type=checkbox]){width:100%;margin-right:0}
.brand span{display:none}.fi button{flex:1}
}
</style></head><body>
<header><div class="hd"><div class="brand"><i></i><span>Software Testing for Beginners</span></div><div class="pg"><div class="bar"><i id="pb"></i></div><div id="cnt">00 / 12</div></div><button id="th">Light/Dark</button></div></header>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<div class="foot"><div class="fi"><button id="pv" onclick="go(cur-1)">&larr; Previous</button><button class="btn" id="nx" onclick="go(cur+1)">Next &rarr;</button></div></div>
<script>
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const logs=[];
const lst=m=>/FAIL|missed/i.test(m)?['no','FAIL']:/Flaky: (?!10\/10)\d+\/10|reset|updated|shared|real email|returned/i.test(m)?['wn','NOTE']:['ok','PASS'];
function log(m){logs.unshift({t:new Date().toLocaleTimeString([],{hour12:false}),m,s:lst(m)});rl()}
function rl(){const e=$("log");if(!e)return;e.innerHTML='<div class="lr lh"><span>TIME</span><span>EVENT</span><span>RESULT</span></div>'+(logs.length?logs.map(l=>`<div class="lr"><span>${l.t}</span><span>${esc(l.m)}</span><span class="bd ${l.s[0]}">${l.s[1]}</span></div>`).join(''):'<div class="lr"><span></span><span>No events yet. Try a demo.</span></div>')}
$("th").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
const B=(el,t,f)=>{const b=document.createElement("button");b.textContent=t;b.onclick=f;el.appendChild(b);return b};
const O=el=>{const o=document.createElement("div");o.className="out";o.textContent="Click a button.";el.appendChild(o);return o};
const CK=(el,t,v)=>{const l=document.createElement("label"),c=document.createElement("input");c.type="checkbox";c.checked=!!v;l.appendChild(c);l.append(" "+t);el.appendChild(l);return c};
const IN=(el,v,w)=>{const i=document.createElement("input");i.value=v;if(w)i.style.width=w;el.appendChild(i);return i};
const P=ok=>ok?"PASS":"FAIL";

function d1(el){const bug=CK(el,"add a bug to add()",false),a=IN(el,"2","60px"),b=IN(el,"3","60px"),e=IN(el,"5","60px"),o=O(el);
 const add=(x,y)=>bug.checked?x-y:x+y;
 B(el,"Run test (a + b = expected)",()=>{const r=add(+a.value,+b.value),ok=r===+e.value;o.textContent=`add(${a.value},${b.value}) = ${r}, expected ${e.value}\n${P(ok)}`;log(`Unit: ${P(ok)}`)})}
function d2(el){const bug=CK(el,"cart gives cents, tax expects dollars",false),o=O(el);
 const cart=()=>bug.checked?1000:10,tax=x=>x*1.1;
 B(el,"Run unit tests",()=>{o.textContent=`cart() works alone: PASS\ntax(100)=110: PASS`;log("Integration: unit tests PASS")});
 B(el,"Run integration test",()=>{const t=tax(cart()),ok=Math.abs(t-11)<.01;o.textContent=`cart -> tax = ${t.toFixed(1)}, expected 11.0\n${P(ok)}${ok?"":"  (parts fine alone, broken together)"}`;log("Integration: "+P(ok))})}
function d3(el){const bug=CK(el,"break the Login button",false),o=O(el);
 B(el,"Run E2E test",async()=>{const st=["open page","type email","click Login","see Welcome"];let t="";for(let i=0;i<st.length;i++){t+=`${i+1}. ${st[i]} ...`;o.textContent=t;await sleep(500);if(i===2&&bug.checked){t+=" FAIL\nLogin button did nothing. Test stopped.";o.textContent=t;log("E2E: FAIL at login");return}t+=" ok\n";o.textContent=t}o.textContent=t+"\nPASS";log("E2E: PASS")})}
function d4(el){const o=O(el);let sent=[];
 const signup=(mail,u)=>{mail(u);return"account created"};
 B(el,"Test with REAL email",async()=>{o.textContent="Sending real email... (slow, costs money, spams user)";await sleep(900);o.textContent="Real email sent in ~900ms. Hard to test.";log("Double: real email")});
 B(el,"Test with FAKE email (spy)",()=>{sent=[];const r=signup(u=>sent.push(u),"ana@x.com");o.textContent=`Result: ${r}\nSpy saw ${sent.length} email call(s) to ${sent[0]}\nPASS, instant, no real email`;log("Double: fake spy PASS")})}
function d5(el){const fix=CK(el,"fix: wait properly",false),o=O(el);
 const run=()=>fix.checked?true:Math.random()<.7;
 B(el,"Run test once",()=>{const ok=run();o.textContent=P(ok);log("Flaky: "+P(ok))});
 B(el,"Run 10 times",()=>{const r=Array.from({length:10},run);o.textContent=r.map(x=>x?"P":"F").join(" ")+`\n${r.filter(x=>x).length}/10 passed. ${r.every(x=>x)?"Stable.":"Same code, different results = flaky!"}`;log(`Flaky: ${r.filter(x=>x).length}/10`)})}
function d6(el){const T={"score 95":0,"score 60":0,"score 10":0},o=O(el),code=["if (s>=90) return 'A';","else if (s>=50) return 'Pass';","else return 'Fail';"],hit=[["score 95"],["score 60"],["score 10"]];
 const show=()=>{const on=Object.keys(T).filter(k=>T[k]),n=hit.filter(h=>on.includes(h[0])).length;o.textContent=code.map((c,i)=>(on.includes(hit[i][0])?"✓ ":"✗ ")+c).join("\n")+`\nCoverage: ${Math.round(n/3*100)}% of lines`};
 Object.keys(T).forEach(k=>B(el,"Run test: "+k,()=>{T[k]=1;show();log("Coverage: ran "+k)}));B(el,"Reset",()=>{for(const k in T)T[k]=0;show();log("Coverage: reset")});show()}
function d7(el){const fx=CK(el,"use fixture (fresh cart each test)",false),o=O(el);
 B(el,"Run 2 tests",()=>{let cart=[];const out=[];["A","B"].forEach(n=>{if(fx.checked)cart=[];cart.push("apple");const ok=cart.length===1;out.push(`Test ${n}: adds 1 item, cart has ${cart.length} -> ${P(ok)}`)});o.textContent=out.join("\n")+(fx.checked?"":"\nTest B inherited A's leftovers!");log("Fixtures: "+(fx.checked?"fresh":"shared"))})}
function d8(el){const bug=CK(el,"bug: reverse() drops last char if long",true),o=O(el);
 const rev=s=>{let r=s.split("").reverse().join("");return bug.checked&&s.length>6?r.slice(1):r};
 B(el,"Example test: 'abc'",()=>{const ok=rev(rev("abc"))==="abc";o.textContent=`reverse(reverse('abc')) = ${rev(rev("abc"))} -> ${P(ok)}\nOne example is happy.`;log("Property: example "+P(ok))});
 B(el,"Property test: 100 random strings",()=>{for(let i=0;i<100;i++){const s=Array.from({length:Math.floor(Math.random()*12)},()=>String.fromCharCode(97+Math.floor(Math.random()*26))).join("");if(rev(rev(s))!==s){o.textContent=`FAIL after ${i+1} tries\nFailing input: '${s}'\nProperty: reverse twice = original`;log("Property: FAIL on "+s);return}}o.textContent="PASS: 100 random inputs OK";log("Property: PASS")})}
function d9(el){const snap="<button>Buy</button>",i=IN(el,snap,"220px"),o=O(el);let s=snap;
 B(el,"Compare to snapshot",()=>{const ok=i.value===s;o.textContent=`saved:   ${s}\ncurrent: ${i.value}\n${P(ok)}${ok?"":"  (output changed, intended?)"}`;log("Snapshot: "+P(ok))});
 B(el,"Update snapshot",()=>{s=i.value;o.textContent="Snapshot saved: "+s;log("Snapshot: updated")})}
function d10(el){const ren=CK(el,"provider renames 'name' to 'fullName'",false),o=O(el);
 B(el,"Run contract test",()=>{const resp=ren.checked?{id:1,fullName:"Ana"}:{id:1,name:"Ana"},bad=[];if(typeof resp.id!=="number")bad.push("id:number");if(typeof resp.name!=="string")bad.push("name:string");o.textContent=`Consumer expects {id:number, name:string}\nProvider sent ${JSON.stringify(resp)}\n${P(!bad.length)}${bad.length?" missing "+bad.join(", "):""}`;log("Contract: "+P(!bad.length))})}
function d11(el){const n=IN(el,"50","70px"),o=O(el);el.insertBefore(n,o);
 B(el,"Run load test (users)",()=>{const u=+n.value||0,ms=50+Math.max(0,u-100)*5,er=u>300?Math.round((u-300)/u*100):0;o.textContent=`${u} users at once\nAverage response: ${ms}ms\nErrors: ${er}%\n${er?"Server breaks!":ms>200?"Getting slow":"Healthy"}`;log(`Load: ${u} users, ${ms}ms, ${er}% errors`)});[100,300,600].forEach(v=>B(el,"Try "+v,()=>{n.value=v}))}
function d12(el){const has=CK(el,"regression test exists",true),o=O(el);
 B(el,"Re-introduce old bug",()=>{o.textContent="Someone edited the code. The old bug is back (hidden).";window._rb=1;log("Regression: bug returned")});
 B(el,"Run all tests",()=>{if(window._rb&&has.checked){o.textContent="FAIL: 'old bug #42' test caught it\nDeploy blocked.";log("Regression: caught")}else if(window._rb){o.textContent="All tests PASS (none watch for #42)\nBug ships to users again!";log("Regression: missed")}else{o.textContent="All tests PASS";log("Regression: PASS")}});
 B(el,"Fix the bug",()=>{window._rb=0;o.textContent="Bug fixed.";log("Regression: fixed")})}

const FOUND=["Test: code that checks other code works.","Assert: a check that must be true.","Pass / Fail: the test result.","Bug: code behaving wrongly.","Mock / Fake: a stand-in for a real part.","Expected vs Actual: what you want vs what you got.","CI: a robot that runs tests on every change."];
const C=[
["Unit Test","Tests one small piece of code alone.","Testing a single Lego brick.",d1,"A test for one function.","Find bugs early and cheaply.","Small bugs hiding in big code.",["Call the function","Compare result to expected","Pass or fail"],"Every function with logic.","Test add(2,3) equals 5.","assert(add(2,3) === 5);","Keep unit tests fast, under 1 ms each.","fn(input) -> output == expected?","Testing many things in one test.","Make add() buggy and run the test."],
["Integration Test","Tests that parts work together.","Checking the Lego bricks click together.",d2,"A test of several parts combined.","Parts can pass alone but fail together.","Mismatches between modules.",["Connect real parts","Run a flow","Check the final result"],"Where modules or DB meet.","Cart plus tax plus database.","assert(total(cart) === 11);","Use a test database, never production.","[A] -> [B] -> [DB]","Skipping them because unit tests pass.","Turn on the mismatch and compare."],
["End-to-End Test","Tests the whole app like a real user.","A full test drive of the car.",d3,"A test that clicks through the real app.","Users use the whole app, not parts.","Broken full journeys.",["Open browser","Do user steps","Check what user sees"],"Critical flows: login, checkout.","Playwright logs in and buys.","await page.click('#login');","Slow and fragile, keep few of them.","User -> UI -> API -> DB","Writing too many E2E tests.","Break login and watch where it stops."],
["Test Double","A fake stand-in for a real dependency.","A crash-test dummy.",d4,"A fake, stub, or spy used in tests.","Real email, payments, and APIs are slow or costly.","Testing without side effects.",["Replace the real part","Run the code","Check the fake was called"],"Email, payments, network calls.","Fake payment gateway.","const send = jest.fn();\nsignup(send);\nexpect(send).toHaveBeenCalled();","Don't fake everything or tests prove nothing.","Code -> [Fake] (not real mail)","Mocking so much nothing real is tested.","Run both and compare speed."],
["Flaky Test","A test that sometimes passes, sometimes fails.","A scale that gives different weights.",d5,"Unreliable test with the same code.","It's a problem, not a tool: timing, randomness, shared state cause it.","Distrust in the test suite.",["Run many times","Find the random cause","Fix the cause, not retry"],"Spot them in CI.","Test waits 1s for a slow API.","await waitFor(() => ready());","Quarantine flaky tests, then fix them.","same code -> P F P P F","Just re-running until green.","Run 10 times, then enable the fix."],
["Coverage","How much of your code the tests run.","Checking how many rooms you inspected.",d6,"A percent of lines or branches tested.","Shows untested code.","Blind spots.",["Run tests","Track lines executed","Report the percent"],"Reviewing test quality.","Coverage report in CI.","jest --coverage","100% coverage doesn't mean no bugs.","code: ✓✓✗  = 66%","Chasing 100% with weak asserts.","Reach 100% using three tests."],
["Fixtures","Known starting data set up before each test.","Setting the chessboard before each game.",d7,"Prepared data or state for tests.","Tests need the same start each time.","Tests affecting each other.",["Create fresh data","Run test","Clean up"],"Any test needing data.","Fresh DB rows per test.","beforeEach(() => { cart = []; });","Reset state before each test.","[setup] -> test -> [cleanup]","Sharing state between tests.","Run with and without the fixture."],
["Property Test","Test rules that hold for many random inputs.","Testing a lock with many keys, not one.",d8,"A test generating many random inputs.","You can't think of every case.","Edge cases you didn't imagine.",["State a rule","Generate random inputs","Report a failing input"],"Parsers, sorting, math.","fast-check, Hypothesis.","fc.assert(fc.property(fc.string(), s => rev(rev(s)) === s));","Save failing seeds to replay.","rule + random inputs -> find breaker","Writing weak or wrong properties.","Run the example, then the property."],
