<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>System Design — Interactive Course</title>
<style>
:root{--bg:#f6f7f9;--pn:#fff;--fg:#17202a;--mut:#667085;--line:#dde1e7;--acc:#0e7490;--ok:#15803d;--bad:#dc2626;--warn:#d97706;--code:#0f172a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--pn:#161b22;--fg:#e6edf3;--mut:#8b949e;--line:#30363d;--acc:#38bdf8;--ok:#3fb950;--bad:#f85149;--warn:#e3b341;--code:#010409}}
:root[data-theme="dark"]{--bg:#0d1117;--pn:#161b22;--fg:#e6edf3;--mut:#8b949e;--line:#30363d;--acc:#38bdf8;--ok:#3fb950;--bad:#f85149;--warn:#e3b341;--code:#010409}
*{box-sizing:border-box}html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,Arial,sans-serif}
button{font:inherit;color:var(--fg);background:var(--pn);border:1px solid var(--line);border-radius:8px;padding:9px 14px;min-height:40px;cursor:pointer;margin:3px 6px 3px 0}
button:hover{border-color:var(--acc)}button.p{background:var(--acc);border-color:var(--acc);color:#fff}
input[type=text],input:not([type]){font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin:3px 6px 3px 0}
label{margin-right:10px;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--pn);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 16px}
header h1{font-size:1rem;margin:0;letter-spacing:.08em;white-space:nowrap}
.pg{flex:1;display:flex;align-items:center;gap:10px;font:.85rem ui-monospace,Menlo,monospace;color:var(--mut)}
.pb{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.pb i{display:block;height:100%;background:var(--acc);transition:width .3s}
.wrap{display:grid;grid-template-columns:230px 1fr;max-width:1180px;margin:0 auto}
nav{position:sticky;top:60px;align-self:start;padding:14px 10px;max-height:calc(100vh - 60px);overflow-y:auto}
nav button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:6px;font:.9rem ui-monospace,Menlo,monospace;padding:7px 10px;min-height:36px;margin:0}
nav button.cur{background:var(--pn);outline:1px solid var(--acc);color:var(--acc);font-weight:700}
nav .ok{color:var(--ok)}
main{padding:20px 18px 40px;min-width:0}
.card{background:var(--pn);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.lbl{font:.75rem ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--acc);margin-bottom:8px}
.num{font:700 .9rem ui-monospace,Menlo,monospace;color:var(--acc)}
h2{font-size:1.9rem;margin:2px 0 4px;letter-spacing:.02em}.one{font-size:1.1rem;margin:0}.an{color:var(--mut);margin:4px 0}
.hero h2{font-size:2.4rem}
.ov{font:.95rem/1.4 ui-monospace,Menlo,monospace;text-align:center;white-space:pre}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fg button{text-align:left;margin:0;min-height:64px}.fg b{font:.8rem ui-monospace,monospace;letter-spacing:.08em;color:var(--acc)}.fg small{display:block;color:var(--mut)}
.viz{text-align:center}.fl{font:.9rem/1.4 ui-monospace,Menlo,monospace;color:var(--mut);margin:6px 0}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.bx{border:2px solid var(--line);border-radius:10px;padding:8px 12px;min-width:110px;font:.85rem/1.5 ui-monospace,Menlo,monospace;transition:.2s}
.bx.ok{border-color:var(--ok);color:var(--ok)}.bx.bad{border-color:var(--bad);color:var(--bad)}.bx.warn{border-color:var(--warn);color:var(--warn)}
.bx.hit{background:color-mix(in srgb,currentColor 12%,transparent);transform:translateY(-2px)}
.bx.pop{animation:pop .35s}@keyframes pop{from{transform:translateY(-14px);opacity:0}}
.out{margin:10px auto 6px;font:.9rem ui-monospace,Menlo,monospace;white-space:pre-wrap;border-left:3px solid var(--acc);padding:4px 10px;text-align:left;background:var(--bg);border-radius:0 6px 6px 0;min-height:1.6em}
.big{font:700 1.1rem ui-monospace,monospace}.bad{color:var(--bad)}.okc{color:var(--ok)}.wn{color:var(--warn)}
.dots span{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin:8px 4px}.dots span.on{background:var(--acc);border-color:var(--acc)}
.mb{height:8px;background:var(--line);border-radius:4px;margin:2px 0 8px}.mb i{display:block;height:100%;border-radius:4px}
.ring{width:240px;max-width:100%}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;text-align:left}
.dash>div{border:1px solid var(--line);border-radius:8px;padding:8px;font:.82rem/1.5 ui-monospace,monospace;background:var(--bg)}
.dash h4{margin:0 0 4px;font-size:.72rem;letter-spacing:.12em;color:var(--acc)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;margin:0;white-space:nowrap}
.tabs button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.tp h4{margin:12px 0 2px;color:var(--mut);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}.tp p,.tp ol{margin:0}.tp ol{padding-left:22px}
pre{margin:0;overflow-x:auto;font:.85rem/1.5 ui-monospace,Menlo,monospace}
.code{background:var(--code);color:#e2e8f0;border-radius:8px;padding:10px 12px;margin-top:10px}.ln{color:#64748b;margin-right:12px;user-select:none}
.code i{font-style:normal}.k{color:#c084fc}.s{color:#86efac}.c{color:#94a3b8}
.ascii{border-left:3px solid var(--line);padding-left:10px}
.try{border-color:var(--warn)}.try .lbl{color:var(--warn)}
.pn{display:flex;justify-content:space-between;margin-top:18px}
#con{background:var(--code);color:#cbd5e1;border-radius:12px;padding:12px;margin:14px 0}
#con .lbl{color:#38bdf8}#log{font:.8rem/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;max-height:200px;overflow-y:auto;min-height:3em}
#con button{background:transparent;color:#cbd5e1;border-color:#334155}
@media(max-width:760px){.wrap{display:block}nav{position:static;display:flex;overflow-x:auto;padding:8px;max-height:none;border-bottom:1px solid var(--line);background:var(--pn)}nav button{width:auto;white-space:nowrap}h2,.hero h2{font-size:1.6rem}header h1{font-size:.8rem}.ov{font-size:.8rem}}
</style></head><body>
<header><h1>SYSTEM DESIGN</h1><div class="pg"><div class="pb"><i id="pf" style="width:0"></i></div><span id="pt">0 / 12</span></div><button id="th" aria-label="Toggle theme">◐ Dark</button></header>
<div class="wrap"><nav id="nav"></nav><main><div id="slide"></div>
<div id="con"><div class="lbl">LIVE SYSTEM LOG</div><div id="log"></div><button id="clr">Clear Log</button></div></main></div>
<script>
const $=id=>document.getElementById(id);
const S={cur:-1,seen:new Set(),done:new Set()};let iv=null;
const logs=[];
function log(m){const k=m.indexOf(": "),t=k>0?m.slice(0,k):"SYS",x=k>0?m.slice(k+2):m;logs.unshift(new Date().toLocaleTimeString([],{hour12:false})+"  "+t.padEnd(12)+x);$("log").textContent=logs.join("\n");if(S.cur>=0&&S.cur<12&&!S.seen.has(S.cur)){S.seen.add(S.cur);prog()}}
$("clr").onclick=()=>{logs.length=0;$("log").textContent=""};
const isDark=()=>{const r=document.documentElement.dataset.theme;return r?r==="dark":matchMedia("(prefers-color-scheme:dark)").matches};
const thl=()=>$("th").textContent=isDark()?"☀ Light":"◐ Dark";
$("th").onclick=()=>{document.documentElement.dataset.theme=isDark()?"light":"dark";thl()};thl();
const B=(el,t,f)=>{const b=document.createElement("button");b.textContent=t;b.onclick=f;el.appendChild(b);return b};
const V=el=>{const v=document.createElement("div");v.className="viz";el.appendChild(v);return v};
const CK=(el,t,v)=>{const l=document.createElement("label"),c=document.createElement("input");c.type="checkbox";c.checked=!!v;l.appendChild(c);l.append(" "+t);el.appendChild(l);return c};
const hs=s=>{let h=5381;for(const c of s)h=(h*33+c.charCodeAt(0))>>>0;return h};
const bx=(c,h)=>`<div class="bx ${c||""}">${h}</div>`;

/* ---------- demos (original logic kept, output now visual) ---------- */
function d1(el){const n=[0,0,0],up=[1,1,1];let rr=0,last=-1,msg="Press Send request.";const v=V(el);
 const dr=()=>v.innerHTML=`<div class="fl">Users<br>↓<br>LOAD BALANCER<br>↓</div><div class="row">${n.map((x,i)=>`<div class="bx ${up[i]?"ok":"bad"} ${last===i?"hit":""}"><b>SERVER ${i+1}</b><br>● ${up[i]?"UP":"DOWN"}<br>Requests: ${x}</div>`).join("")}</div><div class="out">${msg}</div>`;
 const send=()=>{last=-1;if(!up.some(x=>x))return"No server alive! Users get errors.";for(let k=0;k<3;k++){const i=rr++%3;if(up[i]){n[i]++;last=i;return`Request → Server ${i+1}`}}};
 B(el,"Send Request",()=>{msg=send();dr();log("LB: "+msg)});B(el,"Send 10",()=>{for(let i=0;i<10;i++)send();msg="10 sent, spread evenly";dr();log("LB: 10 requests")});
 [0,1,2].forEach(i=>B(el,`Toggle S${i+1}`,()=>{up[i]=!up[i];msg="Dead servers are skipped";dr();log(`LB: server ${i+1} ${up[i]?"up":"down"}`)}));dr()}
function d2(el){let s=1,load=60;const v=V(el);const dr=()=>{const cap=s*50,ov=load>cap;v.innerHTML=`<div class="fl">Traffic ${load} req/s<br>↓</div><div class="row">${Array.from({length:s},(_,i)=>bx(ov?"warn":"ok",`<b>S${i+1}</b><br>50 req/s`)).join("")}</div><div class="out">Capacity: ${cap} req/s\nTraffic: ${load} req/s\nStatus: ${ov?"⚠ OVERLOADED, requests fail":"OK"}</div>`};
 B(el,"Add server",()=>{s++;dr();log("Scale: servers="+s)});B(el,"Remove server",()=>{s=Math.max(1,s-1);dr();log("Scale: servers="+s)});
 B(el,"Traffic +50",()=>{load+=50;dr();log("Scale: traffic "+load)});B(el,"Traffic -50",()=>{load=Math.max(0,load-50);dr();log("Scale: traffic "+load)});dr()}
function d3(el){let c=false,t=[],st="",ms=0;const v=V(el);
 const dr=()=>v.innerHTML=`<div class="fl">REQUEST<br>↓</div><div class="row">${bx(st=="hit"?"ok hit":"",`<b>CACHE</b><br>${st=="hit"?"CACHE HIT":st=="miss"?"CACHE MISS":c?"filled":"empty"}`)}${bx(st=="miss"?"warn hit":"",`<b>DB</b><br>${st=="miss"?"read 100ms":"idle"}`)}</div><div class="out">${t.length?`Response: ${ms}ms\nAverage so far: ${Math.round(t.reduce((a,b)=>a+b)/t.length)}ms`:"Click Read item."}</div>`;
 B(el,"Read item",()=>{ms=c?5:100;st=c?"hit":"miss";t.push(ms);c=true;dr();log(`Cache layer: ${st.toUpperCase()} ${ms}ms`)});
 B(el,"Clear cache",()=>{c=false;st="";dr();log("Cache layer: cleared")});dr()}
function d4(el){const q=[];let done=0,id=1,m="Add an order.";const v=V(el);
 const dr=()=>v.innerHTML=`<div class="fl">PRODUCER<br>↓</div><div class="row">${q.length?q.map((x,i)=>bx(i==q.length-1&&m.startsWith("Instantly")?"pop":"",x)).join(""):bx("","empty")}</div><div class="fl">↓<br>WORKER · processed=${done}</div><div class="out">${m}</div>`;
 B(el,"Add Order",()=>{q.push("#"+id++);m="Instantly accepted. User is not waiting.";dr();log("Queue: order added")});
 B(el,"Worker Takes 1",()=>{if(!q.length){m="Queue empty";dr();return}const x=q.shift();done++;m="Worker processed "+x;dr();log("Queue: processed "+x)});dr()}
function d5(el){const T=[];let m="Send a request.";const v=V(el);const pr=()=>{const now=Date.now();while(T.length&&now-T[0]>1e4)T.shift()};
 const dr=()=>{pr();v.innerHTML=`<b>RATE LIMIT</b> · 5 requests / 10 seconds<div class="dots">${[0,1,2,3,4].map(i=>`<span class="${i<T.length?"on":""}"></span>`).join("")}</div>${T.length} / 5 used<div class="out ${m.startsWith("429")?"bad":""}">${m}</div>`};
 B(el,"Send Request",()=>{pr();if(T.length<5){T.push(Date.now());m="200 OK";log("RateLimit: allowed")}else{m="429 TOO MANY REQUESTS\nWait for the window to reset.";log("RateLimit: BLOCKED 429")}dr()});
 iv=setInterval(dr,1000);dr()}
function d6(el){let nodes=["A","B","C"],mv=new Set(),a=0,b=0;const K=[];for(let i=1;i<=24;i++)K.push("key"+i);
 const ring=ns=>ns.map(n=>[hs(n)%360,n]).sort((x,y)=>x[0]-y[0]),own=(k,ns)=>{const p=hs(k)%360,rg=ring(ns);return(rg.find(x=>x[0]>=p)||rg[0])[1]},mod=(k,ns)=>ns[hs(k)%ns.length];
 const col=["#3b82f6","#14b8a6","#f59e0b","#ec4899","#8b5cf6","#22c55e","#ef4444","#64748b"],v=V(el);
 const pt=(d,r)=>[110+r*Math.cos((d-90)*Math.PI/180),110+r*Math.sin((d-90)*Math.PI/180)];
 const dr=()=>{let s=`<svg viewBox="0 0 220 220" class="ring"><circle cx="110" cy="110" r="78" fill="none" stroke="var(--line)" stroke-width="2"/>`;
  K.forEach(k=>{const[x,y]=pt(hs(k)%360,78),m=mv.has(k);s+=`<circle cx="${x}" cy="${y}" r="${m?5:3}" fill="${col[nodes.indexOf(own(k,nodes))]}" ${m?'stroke="var(--fg)" stroke-width="2"':""}/>`});
  nodes.forEach((n,i)=>{const[x,y]=pt(hs(n)%360,78),[tx,ty]=pt(hs(n)%360,98);s+=`<rect x="${x-6}" y="${y-6}" width="12" height="12" rx="3" fill="${col[i]}"/><text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle" font-weight="700" fill="${col[i]}">${n}</text>`});
  v.innerHTML=s+`</svg><div class="out">KEY MOVEMENT (of 24)\nConsistent Hash:  ${a}\nPlain hash % N:   ${b}\nNodes: ${nodes.join(", ")} · squares=nodes, dots=keys, outlined=moved</div>`};
 const go=(ns2,m)=>{mv=new Set(K.filter(k=>own(k,nodes)!==own(k,ns2)));a=mv.size;b=K.filter(k=>mod(k,nodes)!==mod(k,ns2)).length;nodes=ns2;dr();log(`ConsistentHash: ${m}, moved ${a} vs ${b}`)};
 B(el,"Add a node",()=>{if(nodes.length<8)go([...nodes,String.fromCharCode(65+nodes.length)],"Node added")});B(el,"Remove last node",()=>{if(nodes.length>2)go(nodes.slice(0,-1),"Node removed")});dr()}
function d7(el){let L=0,F=[0,0],msg="";const v=V(el);
 const dr=()=>v.innerHTML=`${bx("ok","<b>LEADER</b><br>value = "+L)}<div class="fl">↓ replicates ↓</div><div class="row">${F.map((f,i)=>bx(f===L?"ok":"warn",`<b>FOLLOWER ${i+1}</b><br>value = ${f}<br>${f===L?"fresh":"STALE (lag)"}`)).join("")}</div><div class="out">${msg}</div>`;
 B(el,"Write on leader (+1)",()=>{L++;msg="Written. Followers not updated yet.";dr();log("Replication: leader write")});B(el,"Sync followers",()=>{F=[L,L];msg="Followers copied the leader.";dr();log("Replication: synced")});
 B(el,"Read follower",()=>{msg=F[0]===L?"Fresh value":"STALE value (replication lag)";dr();log("Replication: follower read")});
 B(el,"Leader dies",()=>{L=Math.max(...F);msg="Follower promoted to leader. Service continues.";dr();log("Replication: failover")});dr()}
function d8(el){const S3=[[],[],[]];let msg="";const v=V(el);const i=document.createElement("input");i.value="ana";el.appendChild(i);
 const dr=()=>v.innerHTML=`<div class="fl">USER ID<br>↓ HASH ↓</div><div class="row">${S3.map((x,k)=>bx("",`<b>SHARD ${k+1}</b><br>${x.length} users`)).join("")}</div><div class="out">${msg}</div>`;
 const add=n=>{const s=hs(n)%3;S3[s].push(n);return s+1};
 B(el,"Store user",()=>{const s=add(i.value+Math.floor(Math.random()*1e3));msg=`${i.value} → Shard ${s}`;dr();log("Partition: user -> shard "+s)});
 B(el,"Add 30 random users",()=>{for(let k=0;k<30;k++)add("u"+Math.random());msg="Hash spreads users evenly";dr();log("Partition: 30 users added")});dr()}
function d9(el){let part=false,cp=true,A=1,Bv=1,msg="";const v=V(el);
 const dr=()=>v.innerHTML=`<b>CAP</b> · Mode: <b>${cp?"CP (consistent)":"AP (available)"}</b><div class="row" style="align-items:center">${bx("ok","<b>Node A</b><br>= "+A)}<span class="big ${part?"bad":"okc"}">${part?"──── X ────":"──────────"}</span>${bx(Bv===A?"ok":"warn","<b>Node B</b><br>= "+Bv)}</div>Network: ${part?"BROKEN":"ok"}<div class="out">${msg}</div>`;
 B(el,"Toggle partition",()=>{part=!part;if(!part)Bv=A;msg=part?"A and B can't talk":"Healed, B caught up";dr();log("CAP: partition "+part)});B(el,"Switch CP/AP",()=>{cp=!cp;msg="";dr();log("CAP: mode "+(cp?"CP":"AP"))});
 B(el,"Write on A",()=>{if(part&&cp){msg="REFUSED: can't confirm B, so CP rejects the write";dr();return}A++;if(!part)Bv=A;msg="Write accepted";dr();log("CAP: write A")});
 B(el,"Read from B",()=>{if(part&&cp)msg="ERROR: B refuses to answer (might be stale)";else msg=Bv===A?"B: fresh":"B answers OLD value (stale but available)";dr();log("CAP: read B")});dr()}
function d10(el){let bal=0,id=0,cur=0,msg="Press Pay.";const seen=new Set(),v=V(el),u=CK(el,"Use idempotency key",false);u.parentNode.style.cssText="font-weight:700;color:var(--acc);display:block;margin:8px 0";
 const dr=()=>v.innerHTML=`<div class="fl">PAYMENT<br>Key: ${cur?"pay-"+cur:"-"} · Amount: $10<br>↓</div>${bx("","<b>SERVER</b><br>Total charged: $"+bal)}<div class="out">${msg}</div>`;
 const pay=k=>{if(u.checked&&seen.has(k)){msg=`Duplicate detected: ${k} ignored ✓\nCharged total $${bal}`;log("Idempotency: duplicate ignored");dr();return}seen.add(k);bal+=10;msg=`Charged $10.\nCharged total $${bal}`;log("Idempotency: charged, total $"+bal);dr()};
 B(el,"Pay $10 (new)",()=>{cur=++id;pay("pay-"+cur)});B(el,"Retry same payment",()=>{if(!cur)cur=++id;pay("pay-"+cur)});dr()}
function d11(el){const q=[];let rej=0,msg="";const v=V(el),lim=CK(el,"Limit queue to 5",true);
 const dr=()=>v.innerHTML=`<div class="fl">PRODUCER<br>↓↓↓↓↓</div><div class="row">${Array.from({length:Math.max(5,q.length)},(_,i)=>bx(i<q.length?(q.length>=5&&lim.checked?"bad":"ok"):"",i<q.length?"#"+(i+1):"·")).join("")}</div><div class="fl">↓<br>WORKER</div><div class="out ${msg.startsWith("503")?"bad":""}">Queue size=${q.length}  rejected=${rej}${q.length>20?"  ⚠ memory growing dangerously!":""}\n${msg}</div>`;
 B(el,"Produce 3",()=>{let m="3 accepted";for(let i=0;i<3;i++){if(lim.checked&&q.length>=5){rej++;m="503 QUEUE FULL\nProducer must slow down."}else q.push(1)}msg=m;dr();log("Backpressure: "+m.split("\n")[0])});
 B(el,"Consume 1",()=>{q.shift();msg="Consumer finished 1";dr();log("Backpressure: consumed")});dr()}
function d12(el){let ok=0,bad=0,id=0,L=[],sp=[],line="",big="";const v=V(el),sl=CK(el,"DB is slow",false);
 const dr=()=>v.innerHTML=`<div class="dash"><div><h4>LOGS</h4>${L.length?L.join("<br>"):"no requests yet"}</div><div><h4>METRICS</h4>Requests: ${ok+bad}<br>Error rate: ${ok+bad?Math.round(bad/(ok+bad)*100):0}%</div><div><h4>TRACE</h4>${sp.length?sp.map(x=>`${x[0]} ${x[1]}ms<div class="mb"><i style="width:${Math.min(100,x[1]/4)}%;background:${x[0]==big?"var(--warn)":"var(--acc)"}"></i></div>`).join("")+"⚠ Slowest: "+big:"-"}</div></div>`;
 B(el,"Send request",()=>{const f=Math.random()<.25,d=sl.checked?400:30;f?bad++:ok++;id++;sp=[["gateway",8],["service",20],["db",d]];big=sp.reduce((a,b)=>b[1]>a[1]?b:a)[0];
  line=`req#${id} ${f?"ERROR 500":"OK 200"}`;L.unshift(line);L=L.slice(0,5);dr();log(`Observe: ${line}, slowest=${big}`)});dr()}

const FOUND=["Server: a computer that answers requests.","Request / Response: a question and its answer.","Latency: how long a request takes.","Throughput: how many requests per second.","Node: one machine in a group.","Stale: old data that is no longer correct.","Bottleneck: the slowest part that limits everything."];
/* [title, one, analogy, demo, what, why, solves, how[], when, real, code, prod, ascii, mistakes, exercise] */
const C=[
["Load Balancer","Spreads requests across many servers.","A supermarket host sending shoppers to open tills.",d1,"A gateway that picks a server for each request.","One server can't handle everyone.","Overload and single point of failure.",["Request arrives","LB picks a healthy server","Server replies"],"Any app with more than one server.","Nginx, AWS ALB.","let i=0;\nfunction pick(s){ return s[i++ % s.length]; }","Add health checks to skip dead servers.","Users -> [LB] -> S1\n             -> S2\n             -> S3","Forgetting the LB itself can fail.","Kill 2 servers, send 10 requests."],
["Horizontal Scale","Add more machines instead of a bigger one.","More cashiers instead of a faster cashier.",d2,"Growing by adding servers.","One machine has a limit.","Hitting the ceiling of one server.",["Traffic grows","Add servers","LB shares work"],"Growing apps.","Netflix runs thousands of servers.","// servers needed\nMath.ceil(traffic / perServer);","Servers should be stateless to scale easily.","[S1] [S2] [S3] [S4]  <- add more","Keeping user data inside one server.","Traffic 200: how many servers?"],

const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const hl=s=>esc(s).replace(/(\/\/.*)/g,'<i class="c">$1</i>').replace(/('[^']*')/g,'<i class="s">$1</i>').replace(/\b(const|let|function|return|if|else|new|for)\b/g,'<i class="k">$1</i>');
const explored=i=>S.seen.has(i)||S.done.has(i);
function prog(){const n=C.filter((_,i)=>explored(i)).length;$("pf").style.width=n/12*100+"%";$("pt").textContent=n+" / 12";nav();const c=$("cnt");if(c)c.textContent=n+" / 12 topics completed"}
function nav(){$("nav").innerHTML=`<button class="${S.cur<0?"cur":""}" data-i="-1">⌂ Introduction</button>`+C.map((c,i)=>`<button class="${S.cur===i?"cur":""}" data-i="${i}"><span class="${explored(i)?"ok":""}">${S.cur===i?"→":explored(i)?"✓":"○"}</span> ${String(i+1).padStart(2,"0")} ${c[0]}</button>`).join("")+`<button class="${S.cur===12?"cur":""}" data-i="12">★ Summary</button>`;
 $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.i));const a=$("nav").querySelector(".cur");if(a&&a.scrollIntoView)a.scrollIntoView({block:"nearest",inline:"center"})}
function go(i){S.cur=Math.max(-1,Math.min(12,i));clearInterval(iv);const el=$("slide");el.innerHTML="";
 if(S.cur<0)intro(el);else if(S.cur===12)final(el);else topic(el,S.cur);nav();scrollTo(0,0)}
